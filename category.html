<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Reality - Category</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080b18;
            color: white;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        header {
            height: 70px;
            background: #080b18;
            border-bottom: 1px solid rgba(110,231,255,0.15);

            display: flex;
            align-items: center;

            padding: 0 40px;
        }

        .logo {
            color: #6ee7ff;
            font-size: 24px;
            font-weight: bold;
        }

        .back {
            margin-left: auto;
            color: #6ee7ff;
        }

        main {
            padding: 110px 40px 50px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .description {
            color: #8d95a8;
            margin-bottom: 35px;
        }

        .movie-grid {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 35px 22px;
        }

        .movie-card {
            min-width: 0;
        }

        .poster {
            position: relative;

            width: 100%;
            aspect-ratio: 2 / 3;

            overflow: hidden;

            border-radius: 7px;

            background: #121728;
        }

        .poster img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }

        .score {
            position: absolute;

            top: 8px;
            right: 8px;

            padding: 5px 7px;

            background: rgba(0,0,0,0.85);

            color: #6ee7ff;

            border-radius: 4px;

            font-size: 12px;
            font-weight: bold;

            opacity: 0;

            transition: 0.2s;
        }

        .movie-card:hover .score {
            opacity: 1;
        }

        .movie-title {
            margin-top: 9px;

            font-size: 15px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .year {
            margin-top: 5px;

            color: #8d95a8;

            font-size: 13px;
        }

        .empty {
            color: #8d95a8;
            padding: 40px 0;
        }

        @media (max-width: 1100px) {

            .movie-grid {
                grid-template-columns:
                    repeat(4, minmax(0, 1fr));
            }

        }

        @media (max-width: 800px) {

            main {
                padding: 100px 20px 40px;
            }

            .movie-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }

        }

        @media (max-width: 550px) {

            .movie-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

    </style>

</head>

<body>

<header>

    <a
        href="index.html"
        class="logo"
    >
        MOVIE REALITY
    </a>

    <a
        href="index.html"
        class="back"
    >
        ← Home
    </a>

</header>


<main>

    <h1 id="pageTitle">
        Movies
    </h1>

    <p
        class="description"
        id="pageDescription"
    >
    </p>

    <div
        class="movie-grid"
        id="movieGrid"
    >
    </div>

</main>


<script src="movies.js"></script>

<script>

    const params =
        new URLSearchParams(window.location.search);

    const category =
        params.get("category");


    const pageTitle =
        document.getElementById("pageTitle");

    const pageDescription =
        document.getElementById("pageDescription");

    const movieGrid =
        document.getElementById("movieGrid");


    if (!category) {

        pageTitle.textContent = "Movies";

        pageDescription.textContent =
            "Browse movies by category.";

        movieGrid.innerHTML =
            `<div class="empty">
                No category selected.
            </div>`;

    } else {

        pageTitle.textContent = category;

        pageDescription.textContent =
            "Movies selected for the " +
            category +
            " category.";


        const results =
            movies.filter(function(movie) {

                return movie.categories.includes(category);

            });


        if (!results.length) {

            movieGrid.innerHTML =
                `<div class="empty">
                    No movies found in this category yet.
                </div>`;

        } else {

            movieGrid.innerHTML =
                results.map(function(movie) {

                    return `

                        <a
                            href="${movie.id}.html"
                            class="movie-card"
                        >

                            <div class="poster">

                                <img
                                    src="${movie.poster}"
                                    alt="${movie.title}"
                                >

                                <div class="score">
                                    MRP ${movie.mrp}
                                </div>

                            </div>

                            <div class="movie-title">
                                ${movie.title}
                            </div>

                            <div class="year">
                                ${movie.year}
                            </div>

                        </a>

                    `;

                }).join("");

        }

    }

</script>

</body>
</html>
