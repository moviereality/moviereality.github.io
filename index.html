```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie Reality</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080b18;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        header {
            height: 70px;
            background: #080b18;
            border-bottom: 1px solid rgba(110, 231, 255, 0.15);

            display: flex;
            align-items: center;

            padding: 0 50px;

            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .logo span {
            color: #6ee7ff;
        }

        nav {
            display: flex;
            gap: 28px;
            margin-left: 50px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #6ee7ff;
        }

        .search {
            margin-left: auto;
        }

        .search input {
            width: 220px;
            padding: 10px 15px;

            background: #10152a;
            border: 1px solid rgba(110, 231, 255, 0.25);

            border-radius: 20px;

            color: white;
            outline: none;
        }

        .search input::placeholder {
            color: #8b91a8;
        }

        /* HERO */

        .hero {
            height: 650px;
            margin-top: 70px;
            position: relative;
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;

            inset: 0;

            background-size: cover;
            background-position: center;

            opacity: 0;

            transition: opacity 0.8s ease;
        }

        .hero-slide::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    rgba(8, 11, 24, 0.98) 0%,
                    rgba(8, 11, 24, 0.75) 40%,
                    rgba(8, 11, 24, 0.25) 100%
                );
        }

        .hero-slide.active {
            opacity: 1;
        }

        .hero-content {
            position: relative;

            height: 100%;

            display: flex;
            align-items: center;

            padding: 0 8%;
        }

        .hero-text {
            max-width: 600px;
        }

        .hero-label {
            color: #6ee7ff;
            font-size: 13px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: 58px;
            line-height: 1.05;

            margin-bottom: 20px;
        }

        .hero-description {
            color: #c5cadb;

            font-size: 17px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        .rating {
            font-size: 16px;
            margin-bottom: 25px;
        }

        .rating span {
            color: #6ee7ff;
            font-size: 20px;
            font-weight: bold;
        }

        .read-more {
            display: inline-block;

            background: #1683d8;
            color: white;

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 5px;

            font-weight: bold;

            transition: 0.3s;
        }

        .read-more:hover {
            background: #1d9bf0;
        }

        /* HERO DOTS */

        .hero-dots {
            position: absolute;

            bottom: 30px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            gap: 8px;

            z-index: 10;
        }

        .hero-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #667085;

            cursor: pointer;

            transition: 0.3s;
        }

        .hero-dot.active {
            background: #6ee7ff;
            transform: scale(1.3);
        }

        /* SECTIONS */

        section {
            padding: 55px 50px 0;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .section-title span {
            color: #6ee7ff;
        }

        /* REVIEW SLIDER */

        .review-wrapper {
            position: relative;
        }

        .review-slider {
            display: flex;

            gap: 20px;

            overflow-x: auto;

            scroll-behavior: smooth;

            scrollbar-width: none;

            padding-bottom: 10px;
        }

        .review-slider::-webkit-scrollbar {
            display: none;
        }

        .movie-card {
            flex: 0 0 220px;

            text-decoration: none;
            color: white;
        }

        .movie-card img {
            width: 220px;
            height: 320px;

            object-fit: cover;

            border-radius: 8px;

            display: block;

            transition: 0.3s;
        }

        .movie-card:hover img {
            transform: scale(1.03);
        }

        .movie-info {
            padding-top: 12px;
        }

        .movie-info h3 {
            font-size: 16px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .movie-info p {
            color: #6ee7ff;

            font-size: 14px;

            margin-top: 6px;
        }

        /* SLIDER ARROWS */

        .slider-arrow {
            position: absolute;

            top: 45%;

            transform: translateY(-50%);

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background: rgba(8, 11, 24, 0.85);

            color: white;

            font-size: 28px;

            cursor: pointer;

            z-index: 5;
        }

        .slider-arrow:hover {
            background: #1683d8;
        }

        .slider-arrow.left {
            left: -20px;
        }

        .slider-arrow.right {
            right: -20px;
        }

        /* SMALL MOVIE ROWS */

        .movie-row {
            display: flex;

            gap: 20px;

            overflow-x: auto;

            scrollbar-width: none;

            padding-bottom: 10px;
        }

        .movie-row::-webkit-scrollbar {
            display: none;
        }

        .small-card {
            flex: 0 0 170px;
        }

        .small-card img {
            width: 170px;
            height: 250px;

            object-fit: cover;

            border-radius: 7px;

            display: block;

            transition: 0.3s;
        }

        .small-card img:hover {
            transform: scale(1.04);
        }

        /* FOOTER */

        footer {
            margin-top: 80px;

            padding: 35px 50px;

            border-top: 1px solid rgba(110, 231, 255, 0.12);

            text-align: center;

            color: #777f96;

            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            header {
                padding: 0 20px;
            }

            nav {
                display: none;
            }

            .search input {
                width: 150px;
            }

            .hero {
                height: 550px;
            }

            .hero h1 {
                font-size: 40px;
            }

            .hero-description {
                font-size: 15px;
            }

            section {
                padding-left: 20px;
                padding-right: 20px;
            }

            .slider-arrow.left {
                left: 0;
            }

            .slider-arrow.right {
                right: 0;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="logo">
            MOVIE <span>REALITY</span>
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="#movies">
                Movies
            </a>

            <a href="#genre">
                Genre
            </a>

            <a href="#artists">
                Artists
            </a>

            <a href="about.html">
                About
            </a>

        </nav>

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >

        </div>

    </header>


    <!-- HERO -->

    <div
        class="hero"
        id="heroContainer"
    ></div>


    <!-- LATEST REVIEWS -->

    <section id="movies">

        <h2 class="section-title">
            Latest <span>Reviews</span>
        </h2>

        <div class="review-wrapper">

            <button
                class="slider-arrow left"
                onclick="slideReviews(-1)"
            >
                ‹
            </button>

            <div
                class="review-slider"
                id="reviewSlider"
            ></div>

            <button
                class="slider-arrow right"
                onclick="slideReviews(1)"
            >
                ›
            </button>

        </div>

    </section>


    <!-- TOP MOVIES -->

    <section>

        <h2 class="section-title">
            Top <span>Movies</span>
        </h2>

        <div
            class="movie-row"
            id="topMovies"
        ></div>

    </section>


    <!-- LATEST MOVIES -->

    <section>

        <h2 class="section-title">
            Latest <span>Movies</span>
        </h2>

        <div
            class="movie-row"
            id="latestMovies"
        ></div>

    </section>


    <!-- COMING SOON -->

    <section>

        <h2 class="section-title">
            Coming <span>Soon</span>
        </h2>

        <div
            class="movie-row"
            id="comingSoon"
        ></div>

    </section>


    <!-- FOOTER -->

    <footer>

        © 2026 Movie Reality.
        Worth your time or a waste of it?

    </footer>


    <!-- MOVIE DATABASE MUST LOAD FIRST -->

    <script src="movies.js"></script>


    <script>

        /* =========================
           HERO
        ========================= */

        const heroContainer =
            document.getElementById("heroContainer");


        const heroMovies =
            movies.filter(
                movie => movie.reviewAvailable
            );


        heroMovies.forEach(
            (movie, index) => {

                const slide =
                    document.createElement("div");


                slide.className =
                    "hero-slide" +
                    (index === 0
                        ? " active"
                        : "");


                slide.style.backgroundImage =
                    `url('${movie.poster}')`;


                slide.innerHTML = `

                    <div class="hero-content">

                        <div class="hero-text">

                            <div class="hero-label">
                                MOVIE REALITY REVIEW
                            </div>

                            <h1>
                                ${movie.title}
                            </h1>

                            <p class="hero-description">
                                ${movie.synopsis}
                            </p>

                            <div class="rating">

                                MRP Rating:

                                <span>
                                    ${movie.mrp}/10
                                </span>

                            </div>

                            <a
                                href="${movie.id}.html"
                                class="read-more"
                            >
                                Read More
                            </a>

                        </div>

                    </div>

                `;


                heroContainer.appendChild(
                    slide
                );

            }
        );


        /* =========================
           HERO DOTS
        ========================= */

        const heroDotsContainer =
            document.createElement("div");


        heroDotsContainer.className =
            "hero-dots";


        heroContainer.appendChild(
            heroDotsContainer
        );


        heroMovies.forEach(
            (movie, index) => {

                const dot =
                    document.createElement("div");


                dot.className =
                    "hero-dot" +
                    (index === 0
                        ? " active"
                        : "");


                dot.addEventListener(
                    "click",
                    () => showHero(index)
                );


                heroDotsContainer.appendChild(
                    dot
                );

            }
        );


        const heroSlides =
            document.querySelectorAll(
                ".hero-slide"
            );


        const heroDots =
            document.querySelectorAll(
                ".hero-dot"
            );


        let currentHero = 0;


        function showHero(index) {

            heroSlides.forEach(
                (slide, i) => {

                    slide.classList.toggle(
                        "active",
                        i === index
                    );

                }
            );


            heroDots.forEach(
                (dot, i) => {

                    dot.classList.toggle(
                        "active",
                        i === index
                    );

                }
            );


            currentHero = index;

        }


        function nextHero() {

            if (
                heroSlides.length === 0
            ) {
                return;
            }


            currentHero =
                (currentHero + 1) %
                heroSlides.length;


            showHero(currentHero);

        }


        setInterval(
            nextHero,
            6000
        );


        /* =========================
           LATEST REVIEWS
        ========================= */

        const reviewSlider =
            document.getElementById(
                "reviewSlider"
            );


        const reviewedMovies =
            movies.filter(
                movie => movie.reviewAvailable
            );


        reviewedMovies.forEach(
            movie => {

                const card =
                    document.createElement("a");


                card.href =
                    `${movie.id}.html`;


                card.className =
                    "movie-card";


                card.innerHTML = `

                    <img
                        src="${movie.poster}"
                        alt="${movie.title}"
                    >

                    <div class="movie-info">

                        <h3>
                            ${movie.title}
                        </h3>

                        <p>
                            MRP ${movie.mrp}/10
                        </p>

                    </div>

                `;


                reviewSlider.appendChild(
                    card
                );

            }
        );


        /* =========================
           TOP MOVIES
        ========================= */

        const topMovies =
            document.getElementById(
                "topMovies"
            );


        const sortedMovies =
            [...movies].sort(
                (a, b) =>
                    b.mrp - a.mrp
            );


        sortedMovies.forEach(
            movie => {

                const card =
                    document.createElement("div");


                card.className =
                    "small-card";


                card.innerHTML = `

                    <img
                        src="${movie.poster}"
                        alt="${movie.title}"
                        title="${movie.title}"
                    >

                `;


                topMovies.appendChild(
                    card
                );

            }
        );


        /* =========================
           LATEST MOVIES
        ========================= */

        const latestMovies =
            document.getElementById(
                "latestMovies"
            );


        const latestSorted =
            [...movies].sort(
                (a, b) =>
                    b.year - a.year
            );


        latestSorted.forEach(
            movie => {

                const card =
                    document.createElement("div");


                card.className =
                    "small-card";


                card.innerHTML = `

                    <img
                        src="${movie.poster}"
                        alt="${movie.title}"
                        title="${movie.title}"
                    >

                `;


                latestMovies.appendChild(
                    card
                );

            }
        );


        /* =========================
           COMING SOON
        ========================= */

        const comingSoon =
            document.getElementById(
                "comingSoon"
            );


        movies.forEach(
            movie => {

                const card =
                    document.createElement("div");


                card.className =
                    "small-card";


                card.innerHTML = `

                    <img
                        src="${movie.poster}"
                        alt="${movie.title}"
                        title="${movie.title}"
                    >

                `;


                comingSoon.appendChild(
                    card
                );

            }
        );


        /* =========================
           LATEST REVIEWS SLIDER
        ========================= */

        function slideReviews(
            direction
        ) {

            const slider =
                document.getElementById(
                    "reviewSlider"
                );


            slider.scrollBy({

                left:
                    direction * 650,

                behavior:
                    "smooth"

            });

        }


        /* =========================
           SEARCH
        ========================= */

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        searchInput.addEventListener(
            "input",
            function () {

                const searchValue =
                    this.value
                        .toLowerCase()
                        .trim();


                const cards =
                    document.querySelectorAll(
                        "#reviewSlider .movie-card"
                    );


                cards.forEach(
                    card => {

                        const title =
                            card.innerText
                                .toLowerCase();


                        card.style.display =
                            title.includes(
                                searchValue
                            )
                            ? "block"
                            : "none";

                    }
                );

            }
        );

    </script>
<script src="movies.js"></script>

</body>

</html>
