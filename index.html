<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Reality</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080b18;
    color: #ffffff;
}

/* HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 72px;
    background: rgba(8, 11, 24, 0.96);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    padding: 0 5%;
    z-index: 1000;
    border-bottom: 1px solid rgba(110, 231, 255, 0.12);
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffffff;
    margin-right: 45px;
    white-space: nowrap;
}

.logo span {
    color: #6ee7ff;
}

nav {
    display: flex;
    align-items: center;
    gap: 28px;
}

nav a {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 15px;
    transition: 0.3s;
}

nav a:hover {
    color: #6ee7ff;
}

.search {
    margin-left: auto;
}

.search input {
    width: 210px;
    padding: 10px 15px;
    border-radius: 25px;
    border: 1px solid #26304d;
    background: #10162a;
    color: #ffffff;
    outline: none;
}

.search input::placeholder {
    color: #64748b;
}

.search input:focus {
    border-color: #6ee7ff;
}

/* HERO */
.hero {
    margin-top: 72px;
    height: 600px;
    position: relative;
    overflow: hidden;
}

.hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1s ease;
    background-size: cover;
    background-position: center;
}

.hero-slide.active {
    opacity: 1;
}

.hero-slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            rgba(8, 11, 24, 0.38) 0%,
            rgba(8, 11, 24, 0.08) 55%,
            rgba(8, 11, 24, 0.25) 100%
        ),
        linear-gradient(
            0deg,
            rgba(8, 11, 24, 0.55) 0%,
            rgba(8, 11, 24, 0.05) 60%
        );
}

.hero-content {
    position: relative;
    z-index: 2;
    height: 100%;
    max-width: 1250px;
    margin: auto;
    padding: 100px 5%;
    display: flex;
    align-items: center;
}

.hero-text {
    max-width: 600px;
}

.hero-label {
    color: #6ee7ff;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.hero h1 {
    font-size: 60px;
    line-height: 1.05;
    margin-bottom: 18px;
}

.hero-description {
    color: #e2e8f0;
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 22px;
}

.rating {
    color: #ffffff;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.rating span {
    color: #ffffff;
}

.read-more {
    display: inline-block;
    padding: 13px 24px;
    background: #1683d8;
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
    transition: 0.3s;
}

.read-more:hover {
    background: #20a4ff;
    color: #ffffff;
    transform: translateY(-2px);
}

/* HERO DOTS */
.hero-dots {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 9px;
}

.hero-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    cursor: pointer;
    transition: 0.3s;
}

.hero-dot.active {
    background: #6ee7ff;
    width: 25px;
    border-radius: 10px;
}

/* SECTIONS */
section {
    width: 100%;
    padding: 55px 5%;
}

.section-title {
    font-size: 27px;
    margin-bottom: 25px;
}

.section-title span {
    color: #6ee7ff;
}

/* LATEST REVIEWS */
.review-wrapper {
    position: relative;
    width: 100%;
}

.review-slider {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    width: 100%;
}

.review-slider::-webkit-scrollbar {
    display: none;
}

.movie-card {
    flex: 0 0 210px;
    height: 310px;
    position: relative;
    border-radius: 10px;
    overflow: hidden;
    background: #11182d;
    cursor: pointer;
    text-decoration: none;
    color: #ffffff;
    display: block;
}

.movie-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
}

.movie-card:hover img {
    transform: scale(1.04);
}

.movie-info {
    position: absolute;
    bottom: 0;
    width: 100%;
    padding: 45px 15px 15px;
    background: linear-gradient(transparent, rgba(0,0,0,0.95));
}

.movie-info h3 {
    font-size: 17px;
    margin-bottom: 5px;
}

.movie-info p {
    color: #6ee7ff;
    font-size: 14px;
}

/* SLIDER ARROWS */
.slider-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(22, 131, 216, 0.95);
    color: #ffffff;
    font-size: 25px;
    cursor: pointer;
    z-index: 5;
    opacity: 0;
    transition: 0.3s;
}

.review-wrapper:hover .slider-arrow {
    opacity: 1;
}

.slider-arrow.left {
    left: 8px;
}

.slider-arrow.right {
    right: 8px;
}

/* OTHER MOVIE SECTIONS */
.movie-row {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scrollbar-width: none;
    width: 100%;
}

.movie-row::-webkit-scrollbar {
    display: none;
}

.small-card {
    flex: 0 0 200px;
    height: 285px;
    border-radius: 9px;
    overflow: hidden;
    background: #11182d;
}

.small-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.4s;
}

.small-card:hover img {
    transform: scale(1.04);
}

/* FOOTER */
footer {
    margin-top: 30px;
    padding: 45px 5%;
    background: #050711;
    border-top: 1px solid rgba(110, 231, 255, 0.1);
    text-align: center;
}

footer h2 {
    margin-bottom: 10px;
}

footer p {
    color: #94a3b8;
    font-size: 14px;
}

/* MOBILE */
@media (max-width: 768px) {

    header {
        padding: 0 20px;
    }

    .logo {
        margin-right: 20px;
        font-size: 20px;
    }

    nav {
        display: none;
    }

    .search input {
        width: 150px;
    }

    .hero {
        height: 520px;
    }

    .hero-content {
        padding: 80px 25px;
    }

    .hero h1 {
        font-size: 40px;
    }

    .hero-description {
        font-size: 15px;
    }

    section {
        padding: 40px 20px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        MOVIE <span>REALITY</span>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#movies">Movies</a>
        <a href="#genre">Genre</a>
        <a href="#artists">Artists</a>
        <a href="about.html">About</a>
    </nav>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search movies..."
        >
    </div>

</header>


<!-- HERO -->

<div class="hero" id="heroContainer"></div>


<!-- LATEST REVIEWS -->

<section id="movies">

    <h2 class="section-title">
        Latest <span>Reviews</span>
    </h2>

    <div class="review-wrapper">

        <button
            class="slider-arrow left"
            onclick="slideReviews(-1)"
        >
            ‹
        </button>

        <div
            class="review-slider"
            id="reviewSlider"
        ></div>

        <button
            class="slider-arrow right"
            onclick="slideReviews(1)"
        >
            ›
        </button>

    </div>

</section>


<!-- TOP MOVIES -->

<section>

    <h2 class="section-title">
        Top <span>Movies</span>
    </h2>

    <div class="movie-row" id="topMovies"></div>

</section>


<!-- LATEST MOVIES -->

<section>

    <h2 class="section-title">
        Latest <span>Movies</span>
    </h2>

    <div class="movie-row" id="latestMovies"></div>

</section>


<!-- COMING SOON -->

<section>

    <h2 class="section-title">
        Coming <span>Soon</span>
    </h2>

    <div class="movie-row" id="comingSoon"></div>

</section>


<!-- FOOTER -->

<footer>

    <h2>MOVIE REALITY</h2>

    <p>
        Worth your time or a waste of it?
    </p>

    <p style="margin-top:12px;">
        © 2026 Movie Reality
    </p>

</footer>


<!-- MOVIE DATABASE MUST LOAD FIRST -->

<script src="movies.js"></script>


<script>

/* HERO */

const heroContainer =
    document.getElementById("heroContainer");

const heroMovies =
    movies.filter(movie => movie.reviewAvailable);

heroContainer.innerHTML = "";

heroMovies.forEach((movie, index) => {

    const slide =
        document.createElement("div");

    slide.className =
        "hero-slide" +
        (index === 0 ? " active" : "");

    slide.style.backgroundImage =
        `url('${movie.poster}')`;

    slide.innerHTML = `
        <div class="hero-content">

            <div class="hero-text">

                <div class="hero-label">
                    MOVIE REALITY REVIEW
                </div>

                <h1>${movie.title}</h1>

                <p class="hero-description">
                    ${movie.synopsis}
                </p>

                <div class="rating">
                    MRP Rating:
                    <span>${movie.mrp}/10</span>
                </div>

                <a
                    href="${movie.id}.html"
                    class="read-more"
                >
                    Read More
                </a>

            </div>

        </div>
    `;

    heroContainer.appendChild(slide);

});


/* HERO DOTS */

const heroDotsContainer =
    document.createElement("div");

heroDotsContainer.className =
    "hero-dots";

heroContainer.appendChild(heroDotsContainer);


heroMovies.forEach((movie, index) => {

    const dot =
        document.createElement("div");

    dot.className =
        "hero-dot" +
        (index === 0 ? " active" : "");

    dot.addEventListener(
        "click",
        () => showHero(index)
    );

    heroDotsContainer.appendChild(dot);

});


const heroSlides =
    document.querySelectorAll(".hero-slide");

const heroDots =
    document.querySelectorAll(".hero-dot");

let currentHero = 0;


function showHero(index) {

    heroSlides.forEach((slide, i) => {

        slide.classList.toggle(
            "active",
            i === index
        );

    });

    heroDots.forEach((dot, i) => {

        dot.classList.toggle(
            "active",
            i === index
        );

    });

    currentHero = index;

}


function nextHero() {

    if (heroSlides.length === 0) {
        return;
    }

    currentHero =
        (currentHero + 1) %
        heroSlides.length;

    showHero(currentHero);

}


setInterval(nextHero, 6000);


/* LATEST REVIEWS */

const reviewSlider =
    document.getElementById("reviewSlider");

const reviewedMovies =
    movies.filter(movie => movie.reviewAvailable);


reviewedMovies.forEach(movie => {

    const card =
        document.createElement("a");

    card.href =
        `${movie.id}.html`;

    card.className =
        "movie-card";

    card.innerHTML = `
        <img
            src="${movie.poster}"
            alt="${movie.title}"
        >

        <div class="movie-info">

            <h3>${movie.title}</h3>

            <p>
                MRP ${movie.mrp}/10
            </p>

        </div>
    `;

    reviewSlider.appendChild(card);

});


/* TOP MOVIES */

const topMovies =
    document.getElementById("topMovies");

const sortedMovies =
    [...movies]
    .sort((a, b) => b.mrp - a.mrp);


sortedMovies.forEach(movie => {

    const card =
        document.createElement("div");

    card.className =
        "small-card";

    card.innerHTML = `
        <img
            src="${movie.poster}"
            alt="${movie.title}"
            title="${movie.title}"
        >
    `;

    topMovies.appendChild(card);

});


/* LATEST MOVIES */

const latestMovies =
    document.getElementById("latestMovies");

const latestSorted =
    [...movies]
    .sort((a, b) => b.year - a.year);


latestSorted.forEach(movie => {

    const card =
        document.createElement("div");

    card.className =
        "small-card";

    card.innerHTML = `
        <img
            src="${movie.poster}"
            alt="${movie.title}"
            title="${movie.title}"
        >
    `;

    latestMovies.appendChild(card);

});


/* COMING SOON */

const comingSoon =
    document.getElementById("comingSoon");

movies.forEach(movie => {

    const card =
        document.createElement("div");

    card.className =
        "small-card";

    card.innerHTML = `
        <img
            src="${movie.poster}"
            alt="${movie.title}"
            title="${movie.title}"
        >
    `;

    comingSoon.appendChild(card);

});


/* LATEST REVIEWS SLIDER */

function slideReviews(direction) {

    const slider =
        document.getElementById(
            "reviewSlider"
        );

    slider.scrollBy({

        left: direction * 650,

        behavior: "smooth"

    });

}


/* SEARCH */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "input",
    function () {

        const searchValue =
            this.value.toLowerCase().trim();

        const cards =
            document.querySelectorAll(
                "#reviewSlider .movie-card"
            );

        cards.forEach(card => {

            const title =
                card.innerText.toLowerCase();

            card.style.display =
                title.includes(searchValue)
                ? "block"
                : "none";

        });

    }
);

</script>

</body>
</html>
